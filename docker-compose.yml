# Local development services.
# Port 5434 on the host avoids clashing with a local Postgres on 5432
# and with the aux project's Postgres on 5433.
services:
  postgres:
    image: postgres:16-alpine
    container_name: govcms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: govcms
      POSTGRES_PASSWORD: govcms
      POSTGRES_DB: govcms
    ports:
      - "5434:5432"
    volumes:
      - govcms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govcms -d govcms"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  govcms-pgdata:
